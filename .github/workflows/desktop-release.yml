name: Build Desktop Apps
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            artifact: macOS-Apple-Silicon
          - os: windows-latest
            artifact: Windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: SBS-Drone-Soccer-${{ matrix.artifact }}
          path: desktop/dist/**
